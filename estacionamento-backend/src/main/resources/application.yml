spring:
  application:
    name: estacionamento-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/estacionamento
    username: estacionamento
    password: estacionamento
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  servlet:
    context-path: /

app:
  jwt:
    secret: troqueEstaChaveSecretaParaUmaBemLongaEAleatoriaEmProducaoOk1234567890
    expiration-ms: 28800000
  upload:
    dir: ./uploads
  tarifa:
    valor-por-hora: 8.00
    tolerancia-minutos: 15
  ocr:
    tessdata-path: /usr/share/tesseract-ocr/4.00/tessdata
    idioma: eng

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.hibernate.SQL: INFO
    com.estacionamento: DEBUG
